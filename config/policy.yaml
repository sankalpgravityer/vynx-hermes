# Hermes policy. Everything tunable lives here — no magic numbers in code.

pricing:
  default_currency: EUR
  min_price: 3.00

  # ---------------------------------------------------------------------------
  # THE PRICE MODEL
  #
  #   expected_price = retail_price * grade_targets[grade]
  #   min_allowed    = expected_price * (1 - tolerance)
  #   max_allowed    = expected_price * (1 + tolerance)
  #
  # Inside the window  -> correct, left untouched.
  # Outside the window -> clamped to the NEAREST edge, never to the target.
  #
  # Grade C worked example, retail 100.00:
  #   target 0.40      -> expected  40.00
  #   tolerance 0.20   -> window    32.00 .. 48.00
  #   price 13.00      -> too_low   -> 32.00
  #   price 78.00      -> too_high  -> 48.00
  #   price 40.00      -> ok        -> unchanged
  # ---------------------------------------------------------------------------

  # FALLBACK ONLY. The fraction of retail each grade should sell for.
  #
  # The VNYX feed supplies the tenant's OWN Grade.priceFactor with every product,
  # and that always wins — grade codes mean different things per tenant, so these
  # numbers can only ever be a guess at someone else's ladder. They are used when
  # a grade has no priceFactor configured, and the assessment then reports
  # rule="policy_band" plus a PRICE.101 finding so the fallback is never silent.
  grade_targets:
    A: 0.70   # As New   -> 30% off
    B: 0.55   # Good     -> 45% off
    C: 0.40   # Lived In -> 60% off
    D: 0.15   # Recycle  -> 85% off

  # Relative tolerance around the target. 0.20 = the window is target +/- 20%
  # OF THE TARGET (not 20 percentage points of retail).
  tolerance: 0.20

  # Tolerance applied when the target is the tenant's own Grade.priceFactor.
  #
  # Not zero, even though the factor is exact arithmetic, because VNYX only
  # guarantees price == retail * priceFactor after a MANUAL REGRADE. A product
  # priced at analyze time takes its price from an eBay used-listing search
  # instead, so exact equality would flag most of the catalog. This window keeps
  # an eBay price near the tenant's intent quiet while surfacing one far from it.
  # Tighten it towards 0 once every product has been through a regrade, or if you
  # want the eBay-derived prices reported too.
  factor_tolerance: 0.20

  # Optional per-grade override where a wider or tighter window makes sense.
  tolerance_overrides:
    D: 0.35   # salvage pricing is inherently noisier

  condition_to_grade:
    "as new": A
    "new": A
    "brand new": A      # 739 products on the dev copy spell it this way
    "excellent": A
    "good": B
    "very good": B
    "lived in": C
    "fair": C
    "recycle": D
    "poor": D

  # Absolute invariant, checked independently of the window above.
  # No item may ever be priced at or above this fraction of its retail price.
  hard_max_ratio: 0.95

  # Which side of a bad ratio moves.
  #   retail     -> the retail price is the anchor; the SELLING PRICE is corrected.
  #                 This is the behaviour described above.
  #   provenance -> whichever field has weaker provenance moves. Use only once
  #                 your price provenance is genuinely trustworthy.
  anchor: retail

  # How a price is rounded once the arithmetic is done.
  #
  #   exact    write the figure as-is (32.00, 48.00)
  #   charm99  keep the whole units, set the cents to .99 — a window of
  #            15.60-23.40 becomes 15.99-23.99. Rounds UP within the unit, so it
  #            never quietly discounts; at an upper bound it steps down to the
  #            highest .99 that still respects hard_max_ratio.
  #   charm    snap to the NEAREST of charm_endings. Note this crosses unit
  #            boundaries — 23.40 becomes 22.99, a whole unit lower — which is
  #            why charm99 exists.
  round_mode: charm99
  charm_endings: [0.99, 0.95]

  # A correction larger than this % is proposed for review, not applied silently.
  auto_apply_max_delta_pct: 60

  # PRICE.012 — a retail anchor below this is not an anchor. Every window above
  # is a fraction of retail, so a retail of 2.00 makes a selling price of 1.00
  # "correct" and a 40.00 one "800% of retail". The auditor this was ported from
  # carried per-brand floors in price_fallbacks.json; one absolute floor is the
  # honest version until a tenant supplies its own. MEDIUM: the retail field is
  # wrong, the product may be fine.
  retail_floor: 5.00

  # CONSIGNMENT. For these tenants the selling price is the consignor's under
  # contract, not vnyx's to correct: the chain skips the price step, the gate
  # never plans a price write, and PRICE.002/003 stop blocking approval (they
  # stay visible as MEDIUM). PRICE.001 — above retail — is an arithmetic
  # invariant and still blocks. Tenant ids; empty means nobody.
  consignment_tenants: []

confidence:
  # Below this, a field is treated as unreliable and routed to evidence gathering.
  review_threshold: 0.70
  # LLM verdicts below this can never become an auto-applied patch.
  llm_apply_threshold: 0.85
  placeholders: ["unknown", "n/a", "na", "none", "-", "null", "tbd", ""]

# Copy checks that need a number. Everything else in TEXT.* is a comparison of
# fields the product already carries.
copy:
  # TEXT.005 — `material` is a fibre, not a paragraph. Longer than this and the
  # extractor pasted the whole composition line ("100% Cotton. Made in Portugal.
  # Machine wash cold …") into a field the storefront renders as a facet.
  material_max_chars: 60
  # TEXT.006 — the title the pipeline writes at creation and replaces when
  # generation succeeds. Still carrying it means nothing was ever produced; on
  # one batch that was 35 of 61 products, and every one of them would otherwise
  # ship under the placeholder. Prefix match, case-insensitive.
  placeholder_title_prefixes: ["Generating Product"]

completeness:
  # DATA.003 — vintage is one-of-one. A quantity other than this on a product
  # about to be approved is a data-entry slip (0: nothing to sell; 3: a duplicate
  # that will oversell). MEDIUM, so a multi-unit tenant is warned, not blocked;
  # set to null to switch the rule off for a wholesale catalogue.
  expected_inventory: 1

# ATTR.005 — the supplier a tenant's products should all name. The auditor
# carried one canonical supplier per tenant; here it is keyed by tenant id and
# empty by default, so the rule is silent until somebody fills it in.
suppliers:
  canonical_by_tenant: {}

# C-TWINS. A twin (`CBOA-000123`) is the SAME physical garment as its parent
# (`BOA-000123`), listed a second time under the opposite gender so unisex stock
# is discoverable in both departments. Duplication copies the images and not the
# measurements, so twins arrive with blank size / brand and are rejected for it —
# 9 of 9 in the auditor's rehearsal; on this week's production runs it would
# have rescued 5. The `twin` step in repair_product.py copies the GENDER-NEUTRAL
# facts from the parent into blank fields on the twin, before any rule runs.
#
# `never_inherit` is documentation of what the step must not touch — everything
# gender-dependent is recomputed for the twin's own gender by the normal chain.
twins:
  prefixes: ["CBOA-", "CKIL-", "CBEV-", "CSKU-", "CBLM-"]
  inherit_properties:
    ["brand", "international_size", "waist", "length_size", "material", "fit",
     "condition", "color"]
  never_inherit:
    ["gender", "master_category", "category", "subcategory", "mannequin",
     "sizing_guide", "eu_size", "title", "description"]

# IMG.040 — does the picture show the kind of garment the category says?
# The quality gate asks the model to name the garment in the lead render in a
# word or two; both that word and the product's category are mapped to a family
# here, and the gate refuses only when the two families are DIFFERENT and NOT
# adjacent. A word or category that maps to no family decides nothing.
garment_families:
  tops:
    ["shirt", "tee", "t-shirt", "tshirt", "polo", "sweater", "hoodie", "jumper",
     "knit", "sweatshirt", "blouse", "top", "tank", "cardigan", "vest", "fleece",
     "pullover", "jersey"]
  bottoms:
    ["trouser", "pant", "jean", "denim", "short", "skirt", "legging", "chino",
     "jogger", "dungaree", "overall", "bottom", "cargo"]
  dresses: ["dress", "gown", "jumpsuit", "romper", "playsuit"]
  outerwear:
    ["jacket", "coat", "blazer", "parka", "puffer", "gilet", "windbreaker",
     "anorak", "bomber", "trench", "outerwear"]
  footwear:
    ["shoe", "sneaker", "boot", "sandal", "heel", "loafer", "trainer", "footwear"]
  accessories:
    ["cap", "hat", "beanie", "belt", "bag", "scarf", "backpack", "wallet",
     "glove", "sock", "accessor"]
  # Pairs the model routinely conflates; a mismatch between them is not a
  # finding. Tops/outerwear only: a shirt-jacket reads as either. Dresses are
  # deliberately NOT adjacent to tops — a gown rendered on a vest listing
  # (BOA-006114) is exactly the case this exists to catch.
  adjacent:
    - ["tops", "outerwear"]

# --------------------------------------------------------------------------- #
# Filing the garment from its photographs — app/resolver.py resolve_taxonomy
#
# TAX.002 and TAX.003 read COLUMNS: is the category under the master, is the
# subcategory under the category. Both pass on a path that is structurally
# perfect and describes the wrong garment. MID-000615 is a tank top filed under
# `Women > Dresses > Casual Dress`; that path exists in the tenant's tree, so
# nothing fired, while the quality gate raised CATEGORY_IMAGE_MISMATCH and
# returned `review` — a hold with no repair behind it, on every run, forever.
#
# So the tenant's own `{category: [subcategory]}` under the product's master is
# now SENT WITH the vision call that was already happening, and the model picks
# a pair from it. No extra call: the images are attached either way and this
# costs output tokens.
#
# The answer is validated against the tree before anything is written — a reply
# that is not in the list is dropped, never proposed. That is the one field
# where an off-catalog value has already done damage (18 Sep 2026:
# `category: 'hoodie'` on an Adidas t-shirt, republished as a "Deep Burgundy
# Hoodie" by the copy step).
# --------------------------------------------------------------------------- #
taxonomy_from_picture:
  enabled: true
  # ASK EVEN WHEN NO RULE ASKED. This is the cost decision, and it cannot be
  # avoided: a garment filed under a category that EXISTS raises no finding, so
  # waiting for one means waiting forever. MID-000615's record is otherwise
  # clean — the whole planner block is behind `if findings:` and it reached none
  # of it.
  #
  #   true   every product with a garment photograph and a tree to choose from.
  #          Free on any product that already triggered the vision call (same
  #          call, same images, more output tokens); one cached Gemini call
  #          otherwise, once per `llm.cache.ttl_hours`.
  #   false  only alongside a question some rule already raised — cheaper, and
  #          blind to exactly the case this block exists for.
  always_ask: true
  # ABOVE `confidence.llm_apply_threshold` (0.85), deliberately. That floor is
  # for one field; this writes two at once, and a wrong pair costs a re-render
  # as well — `classify_garment_type` picks the render prompt's framing off the
  # category, so a tank top filed as a dress is RENDERED as a dress. Its own
  # knob so it can be raised without moving every other AI write with it.
  #
  # The photo audit read MID-000615's garment at 0.90 and the quality gate at
  # 0.70, which is roughly the spread to expect; 0.9 keeps the confident
  # readings and sends the hesitant ones to a person as a `propose`.
  min_confidence: 0.9

guardrails:
  # Fields the LLM is NEVER allowed to write directly. It may only supply
  # evidence; the deterministic resolver computes the final value.
  llm_forbidden_fields:
    # `condition` is DERIVED from the tenant's grade, not observed.
    #
    # GRADE.001 keeps the pair in sync and the grade drives it. Letting the
    # vision layer write condition too made the two fight: a run wrote
    # `condition` from the photographs, GRADE.001 then fired because it no longer
    # matched the grade label, and the product came out of a clean pass with a
    # NEW blocker it did not have before. The model can still judge `grade` —
    # visible wear is a fair vision question — and the condition follows from it.
    - condition
    - price
    - retail_price
    - inventory
    - sku
    - product_code
    - lpn_code
    - bin_code
    - bin_barcode
  # Fields that are physical ground truth — always escalate, never auto-fix.
  escalate_only_fields:
    - bin_code
    - bin_barcode
    - lpn_code
    - sku

# --------------------------------------------------------------------------- #
# Rules that are reported but never decide anything.
#
# Same keys and values as the tenant's own `AutoApprovalConfig.severityOverrides`
# (see app/approval.py:apply_severity_overrides) — `RULE` or `RULE:field`, valued
# with a severity name or one of ignore/off/none/skip. This block is the DEFAULT
# layer underneath that one: a tenant that sets its own entry for the same key
# still wins, so nothing here can override a deliberate per-tenant decision.
#
# MATERIAL AND GRADE, 18 Sep 2026. Neither is a condition of approval at VNYX.
# Material is a fibre string that arrives from the care label and is very often
# a spelling the tenant's `/material-settings` list has not absorbed yet; grade
# is the operator's own judgement of the garment in their hand, which no check
# here is in a position to overrule. Both were holding products whose data and
# pictures were otherwise correct, so they stop being findings rather than
# staying visible as noise nobody acts on.
#
# Removing an entry brings the rule straight back — nothing else was changed.
rules:
  severity_overrides:
    # Grade: condition ↔ grade sync, Grade A with defects, Grade C/D without.
    GRADE.001: ignore
    GRADE.002: ignore
    GRADE.003: ignore
    # Material: not in the tenant's list, a paragraph where a fibre belongs,
    # and the two "required field" rules SCOPED TO MATERIAL ONLY — DATA.001 and
    # DATA.010 each cover ten fields, and a missing category must keep blocking.
    ATTR.003: ignore
    TEXT.005: ignore
    DATA.001:material: ignore
    DATA.010:material: ignore

taxonomy:
  Men:
    Bottoms: [Jeans, Trousers, Shorts, Joggers, Chinos]
    Tops: [T-Shirts, Shirts, Hoodies, Knitwear, Sweatshirts, Polos]
    Outerwear: [Jackets, Coats, Blazers, Gilets]
    Footwear: [Sneakers, Boots, Shoes, Sandals]
    Accessories: [Belts, Hats, Bags, Scarves]
  Women:
    Bottoms: [Jeans, Trousers, Shorts, Skirts, Leggings]
    Tops: [T-Shirts, Blouses, Shirts, Hoodies, Knitwear]
    Dresses: [Midi, Maxi, Mini, Jumpsuits]
    Outerwear: [Jackets, Coats, Blazers]
    Footwear: [Sneakers, Boots, Heels, Flats, Sandals]
    Accessories: [Belts, Hats, Bags, Scarves]
  Unisex:
    Tops: [T-Shirts, Hoodies, Sweatshirts]
    Bottoms: [Joggers, Shorts]
    Accessories: [Hats, Bags]

# Which mannequin rigs are valid for a given gender+category.
#
# "Bottom" (no gender word) is the rig the edit screen's dropdown offers for
# bottoms and the one readiness derives (vnyx-ui formatters.ts MannequinType);
# approve-products.ts reads it as a bottom rig of no gender and accepts it.
mannequin_map:
  "Men|Bottoms": ["Men Bottom", "Men Bottoms", "Bottom"]
  "Men|Tops": ["Men Top", "Men Tops"]
  "Men|Outerwear": ["Men Top", "Men Outerwear"]
  "Women|Bottoms": ["Women Bottom", "Women Bottoms", "Bottom"]
  "Women|Tops": ["Women Top", "Women Tops"]
  # "Women Top" is what the edit screen offers for a dress (policy sizing.sides
  # files `dress` on the upper ladder); the two older names stay accepted.
  "Women|Dresses": ["Women Top", "Women Dress", "Women Full"]
  "Women|Outerwear": ["Women Top", "Women Outerwear"]

sizing:
  eu_tolerance: 1

  # WHICH CHART ANSWERS FIRST, when a tenant has more than one for the same
  # garment. Added 22 September 2026 at the operator's instruction.
  #
  # Klekt has two men's bottoms charts and they disagree by ~6 EU sizes:
  #
  #   Men Bottoms          W28->36  W32->40  W36->46   (roughly waist + 9)
  #   Men Bottoms (auto)   W28->44  W32->48  W36->52   (exactly waist + 16)
  #
  # `(auto)` is the correct one — waist + 16 is the European men's convention,
  # and it is what the operator writes by hand on the edit screen. The attached
  # chart is the other one, so every bottom was being validated, and would have
  # been repaired, against numbers nobody wants.
  #
  # KNOWN CONSEQUENCE, accepted deliberately. `(auto)` covers W28-W40 only, so
  # the 22 Klekt bottoms at W21-W27 fall through to the attached chart and land
  # on the OTHER convention: W27 reads EU 36 and W28 reads EU 44, an eight-size
  # step for one inch of waist. Fixing the attached chart's values instead would
  # remove both the preference and the cliff; this entry buys the correct
  # numbers for the 273 products in range today without touching tenant data.
  #
  # Keyed by the ATTACHED guide's name, listing the charts to consult before it.
  # Absent key = no preference, which is every other tenant: the product's own
  # guide answers, as it always has.
  chart_preference:
    Men Bottoms: ["Men Bottoms (auto)"]

  # Which half of the body a category and a guide name refer to.
  #
  # SIZE.014 compares the two: a Women > T-Shirts & Polos product sitting on
  # "Women Bottoms" agrees on gender perfectly, so nothing else catches it, and
  # the ladder test cannot either when a tenant's bottoms guide happens to list
  # letter sizes rather than waist numbers.
  #
  # Substring tokens, matched lowercase, so real tenant names resolve without an
  # exhaustive list: "T-Shirts & Polos" hits `shirt`, "Sweaters & Hoodies" hits
  # `sweater`, "Women Bottoms" hits `bottom`. A category or guide matching
  # NEITHER list resolves to no side and the rule stays silent — this decides
  # nothing on a guess. Extend rather than replace when a tenant adds a branch.
  sides:
    bottom:
      - bottom
      - trouser
      - jean
      - pant
      - short
      - skirt
      - legging
      - chino
      - denim bottom
    upper:
      - upper
      - top
      - shirt
      - tee
      - t-shirt
      - polo
      - sweater
      - hoodie
      - jumper
      - knit
      - jacket
      - coat
      - vest
      - blazer
      - dress   # a dress is sized on the upper ladder, not the waist one
      - outerwear
      - sweatshirt
  men_bottoms_waist_in_to_eu:
    28: 44
    29: 45
    30: 46
    31: 47
    32: 48
    33: 49
    34: 50
    36: 52
    38: 54
    40: 56
  women_bottoms_waist_in_to_eu:
    24: 32
    25: 34
    26: 36
    27: 38
    28: 40
    29: 42
    30: 44
    31: 46
    32: 48
  # Plausible inseam range for a given waist (men's jeans, inches).
  length_range_in: [28, 36]

llm:
  enabled: true
  model_fast: "gemini-3.6-flash"
  model_reasoning: "gemini-3.7-flash"
  max_images: 4
  timeout_s: 45
  # Only spend an LLM call when the rule engine actually asked for evidence.
  evidence_only: true

  # FAIL-FAST ON A PROVIDER OUTAGE — app/llm/health.py.
  #
  # Every in-process vision call (care-label read, quality gate) is counted by
  # outcome over a sliding window of the last `window` calls. Once at least
  # `min_samples` are in the window and `error_ratio` of them are hard API
  # errors — 429, 5xx, a rejected key, a timeout; never an "I cannot read this"
  # answer — the run loop STOPS for `cooldown_s` instead of turning the outage
  # into a queue of "no brand or size" rejections. The products already judged
  # keep their verdicts; the one in hand is retried, not judged.
  #
  # 6 samples is three products' worth. 0.7 means a working OpenAI fallback
  # (one Gemini error, one OpenAI success per label) never reads as an outage.
  health:
    window: 20
    min_samples: 6
    error_ratio: 0.7
    cooldown_s: 600

  # VISION RESPONSE CACHE — app/llm/cache.py.
  #
  # The answer to "what is in this picture" does not change while the picture
  # does not, so the gate, the care-label read, the image audit and the
  # background classifier remember their parsed answers and never send the
  # same image to the model twice. Keyed on the image (URL with its query
  # string, or a digest of the bytes), the prompt, the schema and the model —
  # editing a prompt invalidates every answer given to the old one on its own.
  # Failures are never stored; neither is an answer computed with an image
  # missing. The win is on re-runs: --retry after an outage, re-verification
  # after a repair, calibration sweeps.
  #
  # `redis_url` null means one JSON file per answer under `dir` (atomic writes,
  # safe for --workers). Point it at a spare database of the Celery Redis to
  # share the cache between the worker and the CLI. Environment for one run:
  # HERMES_VISION_CACHE=0 (off), HERMES_VISION_CACHE_DIR, HERMES_VISION_CACHE_REDIS.
  cache:
    enabled: true
    ttl_hours: 168
    dir: ".cache/vision"
    redis_url: null

# --------------------------------------------------------------------------- #
# Imagery — the on-model renders and background removal.
# See docs/IMAGERY-VERIFICATION.md for how these numbers were arrived at.
# --------------------------------------------------------------------------- #
imagery:
  # The AI views whose absence is a DEFECT.
  #
  # Deliberately not all five. The three-quarter views were added by a later
  # version of the generation pipeline, so requiring them marks 955 of 2,026
  # products on the measured tenant as defective for missing something most of
  # the catalog never had. They are reported as advisory (IMG.005) instead.
  #
  # Raising the bar is an edit here plus POST /v1/policy/reload — no code change.
  # scripts/audit_product_images.py carries the same list; change both together
  # or the spreadsheet and the Verify button will disagree about a product.
  required_views: ["AI_FRONT", "AI_BACK"]
  all_views: ["AI_FRONT_34", "AI_BACK_34", "AI_FRONT", "AI_BACK", "AI_CLOSEUP"]
  # Only ever required when the tenant has isCloseUpEnabled. Listed separately
  # because it is the one advisory view that is tenant-configurable.
  close_up_view: "AI_CLOSEUP"

  # Views background removal applies to. Care labels and size charts are excluded
  # because a macro of a wash tag is all fabric: the segmenter has no foreground
  # to find and mangles it. Matches needsBackgroundRemoval() in vnyx-api.
  garment_views: ["FRONT", "BACK", "OTHER"]

  # Views a REPAIR will actually run the segmenter over, which is narrower than
  # the list above.
  #
  # `garment_views` is what background removal APPLIES to — it answers "is this
  # photograph un-matted?", and IMG.010 reports the whole set because an
  # un-matted extra angle is still a defect in the gallery.
  #
  # This is the different question of what a repair should PAY to matte before
  # generating, and the answer is only what generation reads: `source_images`
  # seeds the model from FRONT and BACK. Matting the extra angles cost a
  # provider call each and changed nothing about the render — on one product
  # that was four calls to produce two useful cut-outs.
  #
  # Widen this to `garment_views` to go back to matting everything.
  matte_views: ["FRONT", "BACK"]

  # Size charts filed under view OTHER — 904 of them on the measured tenant.
  # Their URL still gives them away: the size-guide uploader writes under
  # /size-charts/, garment photography under /products/. Without this the report
  # claims ~900 size charts need matting, which buries the real findings.
  size_chart_url_markers: ["/size-charts/", "/size-chart/", "/sizecharts/"]

  # A product "in flight" longer than this is stranded, not working. A real run
  # takes ~205s; vnyx-api's generation-reaper waits an hour before touching a row
  # and this matches it, so the two never disagree about which products are stuck.
  stale_generation_hours: 1

  # --- background detection, layer 2 -----------------------------------------
  pixels:
    # Never fetch more than this many images for one product. A product with 12
    # pictures would otherwise mean 12 downloads per button press.
    max_images_fetched: 8
    # Per-image read timeout, and the wall-clock cap on the whole parallel batch.
    # A public pub-*.r2.dev URL is rate-limited by Cloudflare, so a slow object is
    # not rare; the deadline is what keeps one of them from holding the button.
    # Stragglers come back UNKNOWN rather than blocking.
    fetch_timeout_s: 15
    fetch_deadline_s: 30
    # Border band sampled for the background test, as a fraction of the shorter
    # side. The garment is centred, so the frame edge is background by
    # construction unless the shot is cropped tight.
    border_fraction: 0.06
    # Fraction of border pixels that must be fully transparent to call an image
    # cut out. Not 1.0: matting leaves feathered edges, and a composited logo or
    # watermark in a corner is opaque by design.
    transparent_border_min: 0.85
    # Mean per-channel deviation across the border band, 0-255, below which the
    # background reads as a uniform studio sweep rather than a real scene.
    # Calibrated against the tenant's #ffffff backdrop on one side and phone
    # photographs of stockroom shelving on the other.
    uniform_border_max_stddev: 12.0
    # Between uniform_border_max_stddev and this, the answer is genuinely
    # ambiguous — a plain wall looks like a sweep. Only this band escalates to the
    # vision model, and only when use_llm is on.
    ambiguous_border_max_stddev: 26.0

  # --- making the cut-out (app/imaging/cutout.py) -----------------------------
  #
  # Everything Hermes decides while PRODUCING a cut-out, as against judging one
  # that already exists (`readiness.cutouts`). Items 6, 7 and 8 of
  # docs/PICTURE-CHECK-FIXES.md.
  cutout:
    # WHICH SEGMENTERS RUN WHEN NOBODY NAMES ONE — a cost setting (19 Sep 2026).
    #
    # The four are not equally priced. `cloth-seg` is a local ONNX graph and
    # costs nothing per image; `gemini-mask`, `openai-mask` and `gemini-paint`
    # are paid API calls, each tried TWICE, so a photograph cloth-seg cannot cut
    # walked SIX paid calls before the chain gave up. MID-000132 did exactly
    # that across four views — twenty-four paid calls — and produced no cut-out.
    #
    # It never showed up on a bill before because it never ran: the re-matte was
    # refused outright for want of `--keep-better` in vnyx-api, so nothing
    # reached the chain. Implementing that guard is what switched it on.
    #
    # WHAT THIS COSTS, HONESTLY. A cut-out with a stand or a podium left in is
    # now left as it is — cloth-seg is the segmenter that left it in, so asking
    # it again returns the same picture. Those stay flagged and unrepaired.
    #
    # Add "gemini-mask" (and "openai-mask") back to spend again. The allow-list
    # a caller passes explicitly still wins over this.
    strategies: ["cloth-seg"]
    # The long edge every pixel comparison below is made on. 448 to match
    # `readiness.cutouts.garment_check.work_width`: the two ask the same
    # question of the same garment and a different grid would give them
    # different answers about the same picture.
    work_px: 448

    # --- item 7: the set the segmenter left behind ---------------------------
    #
    # `_kept_backdrop` used to abstain whenever the SOURCE's border was not one
    # colour — "source border is not uniform (spread 71), not checked" — which
    # is every studio sweep with uneven lighting, so the check written for a
    # surviving podium was off exactly where podiums are. Hermes returned
    # `ok: true` on the Nike booth photograph (`fc8e53e7`) with the whole
    # podium still in the cut-out (§1.1).
    #
    # It now falls back to the CUT-OUT's own backdrop, which is flat by
    # construction — this module writes (255,255,255,0) under full transparency
    # — and counts the pixels the segmenter KEPT that are that colour and lie
    # outside the garment's outline. A podium is white, kept, and not garment.
    #
    # Measured on that cut-out at the 448px grid, against the same picture with
    # the podium taken off:
    #
    #                            largest region   scattered   bottom band
    #   as cloth-seg cut it           1.70%         2.94%        31.9%
    #   podium removed                0.01%         0.02%         0.0%
    leftover_region_max: 0.01
    # THE BOTTOM BAND, SEPARATELY, BECAUSE A PODIUM IS ALWAYS THERE. Of the
    # KEPT region's own rows, not the frame's — on `fc8e53e7` the frame's
    # bottom rows are transparent, the podium ends three quarters of the way
    # down the picture.
    leftover_bottom_fraction: 0.10
    leftover_bottom_max: 0.25
    # A white shirt on a white backdrop reads as backdrop everywhere and every
    # kept pixel would look like a podium, so at least this much of what was
    # kept has to differ from the backdrop before the question may be put at
    # all. Below it the measurement is `unknown` and NOTHING is refused — the
    # rule §0 sets for every derived mask.
    leftover_garment_min: 0.50
    leftover_min_clear: 0.02

    # --- item 6: a leftover is fixed with a DIFFERENT segmenter --------------
    #
    # Re-matting a stand with cloth-seg produces the same stand: it is a
    # clothing parser, the podium is directly beneath the clothing, and its
    # mask runs at 320px. Measured on the same Nike tee — cloth-seg removed the
    # hanger and the form's neck and kept the whole podium; a matting model
    # removed the podium and kept the hanger. Neither is right alone, so the
    # re-matte asks these and INTERSECTS the answer with cloth-seg, which
    # leaves the garment parser deciding what is cloth.
    #
    # EMPTY, AND EMPTY MEANS DO NOT RE-CUT (19 Sep 2026).
    #
    # Both names that belong here are paid calls, and `strategies` above
    # explains why those are now opt-in. With none configured, a cut-out with a
    # stand or a hanger left in is LEFT AS IT IS: sending it back through the
    # default chain would ask cloth-seg to remove the podium cloth-seg left in,
    # which returns the same picture and spends ~20s a view proving it — how
    # MID-000521 carried the same stand through every repair run.
    #
    # That is a real loss, taken deliberately: those cut-outs stay flagged and
    # unrepaired rather than costing six paid calls each to maybe improve. Put
    # "gemini-mask" back to spend again.
    leftover_strategies: []
    intersect_cloth: true

    # --- item 8: a replacement is never worse than what it replaces ----------
    #
    # KIL-001625's re-matte cut away a large part of the shirt back and
    # KIL-001644's cut into a strap, and both damaged replacements went live:
    # the chain re-mattes through `backfill-bg-removal.ts --replace`, which
    # supersedes the old row, and every measurement Hermes had ran AFTER that.
    # So the new cut-out's garment is compared against the one it would
    # supersede — both segmented against their own flat backdrop, which is the
    # reliable segmentation (§0) as against the lit wall in the photograph
    # (§1.3) — and a worse one is refused before the bytes are handed back.
    #
    # How much less garment it may have. Two segmenters honestly disagree about
    # a hem or a feathered edge by a percent or two; a lost shirt back is a
    # different order of magnitude.
    replace_area_drop_max: 0.10
    # …and the same defect when it is too small to move the total: one strap.
    # A SINGLE PIECE this big, missing and touching the garment's edge, is
    # refused on its own. Opened by `replace_open_px` first, because the thin
    # rim two segmenters always differ by is one connected region around the
    # whole outline and would otherwise read as a missing strap every time.
    replace_loss_region_max: 0.02
    replace_open_px: 5
    # Two cut-outs of different shapes are not the same picture measured twice.
    # Beyond this the replacement is not judged, and therefore not refused.
    replace_ratio_tolerance: 0.05

  # --- generation -------------------------------------------------------------
  generation:
    # "Nano Banana Pro" was `gemini-3-pro-image-preview`, pinned to the same id
    # services/banana-nano.ts uses: renders from the two paths land in the same
    # gallery, so a model change on one side alone makes backfilled products
    # visibly different. THAT IS NOW TRUE — vnyx-api still renders on the Pro
    # model, and this only changes what the Hermes chain produces.
    #
    # 18 Sep 2026: switched to `gemini-3.1-flash-image` for cost. Half the price
    # at the same resolution — 1,120 output tokens either way, $0.067 against
    # $0.134 — and measured at the same speed: 39.0s against 39.2s on
    # MID-000253's AI_FRONT_34, rendered both ways through /v1/imagery/generate,
    # which stores nothing.
    #
    # One product, one view, so this is a trial rather than a calibration. On
    # that sample flash was the better of the two: it reproduced the woman in
    # the product's existing AI_FRONT, while the Pro model drew a different one.
    # Both drew the garment correctly. Revert this line if a class of garment
    # comes back worse.
    model: "gemini-3.1-flash-image"
    # EMPTY ON PURPOSE: one Gemini attempt, then a different vendor.
    #
    # These other Gemini names DO sometimes render a garment the primary refuses —
    # measured on a Bruce Springsteen tour tee, `gemini-3.1-flash-image-preview`
    # and `gemini-2.5-flash-image` both produced a correct render where
    # `gemini-3-pro-image-preview` declined. They were listed for that reason.
    #
    # They are not listed any more because of what the chain costs when it does
    # NOT work, which is the common case: each extra model is a full set of
    # attempts at ~25s per view, and on a refused two-view product the walk from
    # primary through both fallbacks to gpt-image took 265-295s of which ~200s
    # was Gemini models declining in sequence. The analyze worker has always used
    # this single model with no chain, and matching it keeps a repair as fast as
    # a first-pass generation.
    #
    # The refusal is a POLICY decision about the garment's print, so a second
    # Gemini rarely disagrees; a different vendor is the escalation that actually
    # pays. Re-add a name here if a class of garment turns up that gpt-image also
    # refuses — the mechanism is unchanged, only the list is empty.
    fallback_models: []

    # The shape gpt-image is cropped to when the tenant's aspectRatio is "auto".
    #
    # On "auto" Gemini is given no constraint and returns its own natural 2K
    # portrait: measured at exactly 1728x2432 across every unconstrained render
    # on the dev tenant, which reduces to 27:38 (0.7105). gpt-image has no
    # equivalent — it picks from three fixed canvases and lands on 1024x1536
    # (2:3, 0.6667), visibly taller and narrower.
    #
    # Left uncorrected that put two shapes in one gallery. The product page
    # crops to fit, and on the taller gpt-image render what it cropped was the
    # bottom: the model's feet, and the vnyx.ai watermark in the corner. A
    # missing watermark was how it was noticed.
    #
    # Gemini is deliberately NOT constrained to this instead — that would change
    # the shape of every future Gemini render and leave them mismatched against
    # the existing catalog. The fallback conforms to the primary, not the
    # reverse.
    auto_portrait_ratio: "27:38"

    # Last resort: a different VENDOR, not another Gemini model.
    #
    # Gemini blocks a garment whose print names or shows a real person, on the
    # REQUEST rather than the response — `prompt_feedback.block_reason` with zero
    # candidates, back in under four seconds where a real render takes twenty-five.
    # A classifier reads the request before the generation model does, so no
    # wording changes the outcome and every Gemini model above gives the same
    # answer. Measured on a `RODGERS 12` Packers jersey: all three refused,
    # gpt-image-1 rendered it correctly.
    #
    # Reached only when every Gemini model produced nothing, so it costs nothing
    # on the overwhelming majority of products. Needs OPENAI_API_KEY; silently
    # skipped without one.
    # ON: the account is funded again. Note that `available()` only checks the
    # key EXISTS, never that it has credit — when the balance next runs out,
    # every refused garment will walk the whole chain and then pay a
    # guaranteed-402 round trip to finish with nothing. Set this false the day
    # that happens rather than waiting for the timeouts to explain it.
    openai_fallback: true

    # The billed tier. gpt-image prices per OUTPUT TOKEN, and the token count is
    # a function of size and quality alone — at 1024x1536, roughly 400 tokens at
    # `low`, 1.6k at `medium`, 6.2k at `high`. So `high` costs about 15x `low`
    # for the same view, and leaving this unset is NOT free: unset means "auto",
    # which resolves towards the top.
    #
    # `medium` because these are catalogue renders shown at ~1024px wide, where
    # the extra detail `high` buys is not visible, and because this is the
    # fallback path — reached only for garments the primary refused, on a budget
    # that has to cover the whole catalogue rather than a few hundred views.
    openai_quality: "medium"

    # SAFETY THRESHOLDS, set explicitly rather than left to the API default.
    #
    # These are a documented request parameter. Unset, the developer API applies
    # BLOCK_MEDIUM_AND_ABOVE, which is stricter than the thresholds Google runs
    # on its own consumer surface — the Gemini app renders a player-name jersey
    # on a model, back view included, while the same content through this API
    # comes back IMAGE_OTHER.
    #
    # Second-hand clothing photographed for resale is exactly the benign domain
    # the parameter exists to tune for. BLOCK_ONLY_HIGH is a threshold move
    # inside what Google permits, not a way around a decision.
    #
    # HONESTLY UNCERTAIN whether it helps: an image refusal can come from an
    # output-side filter these thresholds do not reach. Cheap to try, and the
    # test command tells us. Set safety_relaxed: false to go back to defaults.
    safety_relaxed: true

    # What to do when NO single model can render every requested view.
    #
    # true  — assemble the complete set from whichever models managed each view,
    #         and flag it loudly. The front and back may not look like the same
    #         person, but both images exist.
    # false — keep the best single-model partial instead. The set always matches;
    #         a view no single model could do alongside the others is reported
    #         missing even when another model rendered it.
    #
    # Measured on a John Cena WWE tee: gemini-2.5-flash rendered the front and
    # gemini-3.1-flash-image-preview the back, but neither could do both — the
    # print is a photograph of the wrestler's face, which every model refuses on
    # one side or the other. With this false the operator is told the front could
    # not be generated while a perfectly good front sits in memory.
    #
    # A CONSISTENT COMPLETE SET IS ALWAYS PREFERRED and tried first; this only
    # decides the fallback when that is impossible.
    allow_mixed_models: true
    # Gemini imageConfig defaults, overridden per tenant where configured.
    default_resolution: "2K"
    supported_aspect_ratios:
      ["1:1", "2:3", "3:2", "3:4", "4:3", "4:5", "5:4", "9:16", "16:9", "21:9"]
    # Extra garment photos passed as context beyond front and back. The TS worker
    # caps at 1 to hold memory down; matched here.
    max_context_images: 1
    timeout_s: 300
    # Retries for TRANSIENT faults only — a 504 DEADLINE_EXCEEDED arriving four
    # seconds into a request that normally takes twenty-five. A content refusal
    # is never retried: it is a decision, and repeating the identical request
    # gets the identical answer while doubling the wait.
    max_retries: 2
    retry_backoff_s: 3

# --------------------------------------------------------------------------- #
# Quality gate — the one look at the LEAD RENDER before a product is approved.
# app/imaging/quality_gate.py; runs as the `gate` step of repair_product.py,
# after render and before approve.
#
# Every other check reads columns. This one asks a vision model seven things
# about the picture a shopper will see — model present, face intact, model
# gender, usable lead, body coherent, what is wrong, front or back — in ONE
# call, and turns the answer into an action:
#
#   ok       approve may proceed
#   regen    the content is wrong: hold, outcome IMAGE_QUALITY or
#            MODEL_GENDER_MISMATCH. A re-render is the likely fix.
#   review   the gate could not decide (provider down, image unreachable):
#            the product is RETRIED, not held — see llm.health above.
#
# Runs in shadow mode too, so a dry run reports what the gate would refuse.
# Measure its false-block rate on a batch that was approved by hand before
# trusting it with a tenant.
# --------------------------------------------------------------------------- #
quality_gate:
  enabled: true
  # When the gate cannot run at all (no GEMINI_API_KEY), block approval rather
  # than skip it. false = a rules-only deployment approves without the gate,
  # which is the pre-gate behaviour.
  required: true
  # Which render is judged, in order of preference. Only AI renders: the gate
  # is about the on-model image, and a product with none is refused by the
  # approval pre-flight anyway ("missing AI_FRONT").
  lead_views: ["AI_FRONT", "AI_FRONT_34"]
  # Each of these can be switched off independently. Removing one turns that
  # finding into a soft flag — recorded, never blocking. `category_mismatch`
  # is the one DATA question the picture answers (see garment_families); the
  # other four are render defects.
  # `body_size_mismatch` (readiness phase 4): the model's build two bands from
  # the garment's size regenerates the set; thresholds under readiness.body_size.
  # `cropped_model`: a model cut at the knees / waist on a view that must show
  # the whole figure (MODEL_CROPPED) re-renders that view. Anatomy alone did
  # not catch it — a clean knee crop is a coherent body (MID-000247).
  # `bad_composition`: a render whose FIGURE does not fill its frame — an empty
  # band below the model, or a model a fraction of the frame's height — is
  # re-rendered on its own (IMAGE_COMPOSITION). A pixel test over every view,
  # not only the lead; see `composition` below and app/imaging/composition.py.
  #
  # `body_size_mismatch` IS OUT (19 Sep 2026) — and it is still measured.
  #
  # It was the most expensive rule here by a distance. The gate itself costs 6s
  # a product, 2.3% of a run measured over 18 products; what it ASKS FOR is the
  # re-render, and a build mismatch re-renders THE WHOLE SET because the model
  # carries every view. `regen` was 156s a product and 24.8% of that run, the
  # single largest line, and eight of the eighteen went through it.
  #
  # And it is the weakest of the three. A build read off a render is one band of
  # judgement — "slim" against an XL garment — where a gender or a garment
  # family is a fact about the picture. Removing it from this list does not turn
  # the question off: `decide` still asks it and still records
  # "build one band off — model slim, garment size XL (plus)" in `soft`, so it
  # is on the row and in the report. It simply stops costing a paid re-render.
  #
  # `gender_mismatch` and `category_mismatch` stay, which is the point: the two
  # that catch a woman modelling a men's shirt, or a tank top filed as a dress,
  # are the ones worth a regeneration.
  #
  # Put the name back to spend on it again. Heavier alternative:
  # `readiness.body_size.enabled: false` stops the measurement as well.
  block_on: ["no_model", "bad_face", "broken_body", "gender_mismatch",
             "category_mismatch", "cropped_model",
             "bad_composition"]
  composition:
    enabled: true
    views: ["AI_FRONT_34", "AI_BACK_34", "AI_FRONT", "AI_BACK", "AI_CLOSEUP"]
    # Calibrated on 189 approved renders (39 products): the widest empty band on
    # a good render is 0.10 and the shortest figure 0.87 of the frame;
    # MID-000247's bad three-quarter left 0.22 empty and stood 0.76. Midway.
    max_bottom_margin: 0.15
    min_height_fill: 0.82
    # A pixel this far (RGB) from the backdrop colour is figure; the vnyx.ai
    # badge in the bottom-right corner is masked out.
    backdrop_tolerance: 28
    badge_width: 0.24
    badge_height: 0.10
  # The views that must show the model head to feet. NOT the three-quarter
  # views — the prompt asks for those "knee-up, feet cropped out of frame, NOT
  # a full-body shot", so a knee crop there is the design (and they lead the
  # gallery: VIEW_RANK puts front¾ first). The close-up is a detail; footwear
  # (knee-to-floor) and accessories (head-and-shoulders) are exempt whatever
  # the view.
  full_body_views: ["AI_FRONT", "AI_BACK"]
  # Below this confidence a crop is a soft flag, not a re-render.
  framing_min_confidence: 0.7
  # Sub-categories legitimately shot without a model. NO MODEL is a soft flag
  # on these; BAD FACE and BROKEN BODY still block (they cannot fire without a
  # model, so in practice these pass).
  accessory_terms:
    ["cap", "caps", "beanie", "beanies", "hat", "hats", "gloves", "belt",
     "belts", "scarf", "scarves", "bag", "bags", "backpack", "backpacks",
     "accessories", "accessory", "wallet", "wallets", "socks", "sunglasses"]
  # null = llm.model_fast.
  model: null

# --------------------------------------------------------------------------- #
# Photo audit — what the garment PHOTOGRAPHS say. app/imaging/photo_audit.py
#
# The gate above judges the render, which is generated and shows no wear. This
# is ONE more call per product over the cut-outs and the renders together,
# answering two of the auditor's checks the port had deferred:
#
#   GRADE_SUSPECT  the photographs show wear at least `disagreement_steps`
#                  WORSE than the record's grade, on the shared Grade.severity
#                  scale none < minor < moderate < major. Held for a person;
#                  the defects the model saw are listed. The grade is never
#                  written. Photos that look BETTER than the grade are a soft
#                  flag (under-grading costs margin, not trust).
#   IMAGE_DEFECT   a PHOTOGRAPH or cut-out is not what its slot says —
#                  background left in a cut-out, a close-up filed as a front.
#                  Soft by default; `gallery.block: true` holds. Nothing can
#                  re-take a photograph.
#   RENDER_DEFECT  an AI RENDER the model calls defective — a smeared limb,
#                  duplicated garments, clutter, text in the scene. The gate
#                  judges the lead only; the other four renders are seen HERE
#                  (MID-000253: knees blurred to white on the AI_FRONT_34, the
#                  AI_FRONT beside it passed the gate). `render_defects: regen`
#                  re-renders THAT VIEW through the chain's regen step, same
#                  model identity (the renderer is handed the stored personality
#                  and the AI_FRONT as reference); `hold` makes it a person's
#                  IMAGE_DEFECT; `soft` records it and nothing follows.
#
# Two steps is the auditor's calibration: one step apart is the honest
# disagreement of two people looking at the same jeans. `required: false`
# means a provider failure here blocks nothing — the gate is the definition of
# "may this leave Review"; this adds evidence to it.
# --------------------------------------------------------------------------- #
photo_audit:
  enabled: true
  required: false
  wear:
    # OFF, 18 Sep 2026 — grade is not a condition of approval (see the
    # `rules.severity_overrides` block above, which retires GRADE.001-003 for the
    # same reason). With this false the wear question still appears in the schema
    # and comes back `unknown`, `decide()` skips the comparison entirely, and no
    # GRADE_SUSPECT can be raised.
    #
    # It costs nothing to leave off. The two images this pass selected are the
    # FRONT and BACK cut-outs, which the gallery pass below picks up anyway and
    # the selector deduplicates by URL — so the vision call carries the same
    # pictures either way. Set true to bring the grade comparison back.
    enabled: false
    views: ["FRONT", "BACK"]
    max_images: 2
    disagreement_steps: 2
    min_confidence: 0.6
    block: true
  gallery:
    enabled: true
    views: ["FRONT", "BACK", "AI_FRONT", "AI_BACK", "AI_FRONT_34", "AI_BACK_34", "AI_CLOSEUP"]
    # EVERY live cut-out of a garment view goes (a flat lay and a booth shot
    # are two FRONT cut-outs — MID-000569's broken one was the second), plus
    # the five renders.
    max_images: 10
    block: false
    # regen | hold | soft — what a defective AI render becomes (see above).
    # The re-render is paid and counts against readiness.max_regenerations_per_run.
    # Also fired when one render shows a DIFFERENT person than the others
    # (the `same_model` question): that view is re-rendered against them.
    #
    # 18 Sep 2026: `same_model` is judged on FACES ALONE — the model answers
    # `face_visible` per render and only the renders with a face are compared.
    # A back view or a detail crop is never odd. BOA-006151 (AI_BACK,
    # AI_BACK_34) and BOA-006153 (AI_CLOSEUP) were false positives on renders
    # with no face in them; MID-000569's close-up had one and is still caught.
    render_defects: regen
    # 21 Sep 2026 — WHAT IS BEHIND THE MODEL, AND WHETHER THE BODY IS WHOLE.
    # Two questions the audit had never asked, so a render made in front of the
    # studio's own backdrop rig, ceiling beams and shelving answered ok = true
    # (MID-000475 AI_FRONT_34, and 9 of 10 products in the first sample had at
    # least one). Both are MEASURED like the leftovers, because "is the
    # background clean" with no scale flags every soft shadow:
    #
    #   scene       plain | minor | cluttered   — only `cluttered` is a defect
    #   body_flaw   none  | slight | clear      — only `clear` is a defect
    #
    # No switch of their own: both are RENDER_DEFECTs and follow
    # `render_defects` above. A cached answer written before this has neither
    # field and is judged exactly as it was.
    #
    # FRAMING — where the picture may cut the model, per view. The gate owns
    # this rule for the single lead render it judges (quality_gate's
    # `full_body_views`); these are the same words applied to all five, which
    # is what caught MID-000425's AI_FRONT_34 ending mid-shin with no feet.
    #   defect  a render framed wrongly is re-rendered (follows render_defects)
    #   soft    recorded on the product and nothing else — the count before the bill
    #   off     not asked
    #
    # SOFT, 21 Sep 2026, and deliberately. Asked which of these to act on, the
    # user drew the line where the shopper sees it: a dirty background is the
    # severe fault and gets re-rendered; where the frame cuts the model is not
    # worth a paid render. MID-000425 is the case — its AI_CLOSEUP stands in
    # front of a rail of other garments (severe, re-rendered on the `scene`
    # answer) while its AI_FRONT_34 merely ends at the ankles (recorded here,
    # nothing follows). A soft note is also kept out of the picture-failure
    # sheets by `audit_approved_window.PICTURE_FAILURE_CODES`, so a framing
    # answer cannot pad the repair list.
    framing: soft
    full_body_views: ["AI_FRONT", "AI_BACK"]
    # Knee-up by design (nanobanana.py asks for exactly that), so only a cut
    # THROUGH the lower leg is wrong here. A bottom is the exception and needs
    # its hem: every body view of one must show the feet. Footwear and
    # accessories are exempt whatever the view, as in the gate.
    half_body_views: ["AI_FRONT_34", "AI_BACK_34"]
    # rematte | hold | soft — what a defective CUT-OUT becomes: a collar or
    # sleeve the mask cut away, a stand or hand left in (MID-000569: the
    # sweater's neckband missing from both FRONT cut-outs). `rematte` re-cuts
    # it from the raw archive through the chain's rematte step (CUTOUT_DEFECT —
    # a flag while readiness.cutouts.hold is soft, a hold once it is block).
    #
    # 18 Sep 2026: a leftover — hanger, hook, stand, podium, hand — is MEASURED
    # (`leftovers`, extent none|slight|clear) and only `clear` is a defect. A
    # hook tip at a neckline is `slight`, recorded and never flagged
    # (MID-000591 FRONT reported a hanger that was not in the frame);
    # MID-000521's podium under all four cut-outs is `clear` and still holds.
    # No switch: a leftover below the bar is not a policy question, it is an
    # answer the check should never have been giving.
    cutout_defects: rematte
  # null = llm.model_fast.
  model: null

# --------------------------------------------------------------------------- #
# Readiness — the master category is the anchor. docs/READINESS-PLAN.md, phase 1.
#
# Every field a product's approval hangs off is settled FROM the master category:
# the gender property follows it, category and subcategory must sit under it in
# the tenant's tree, the sizing guide follows gender + side + ladder, and the
# mannequin rig is DERIVED from it and written, never read (decision 6 — TAX.005
# no longer rewrites the master to match the rig).
#
# One switch per check is added as later phases land (cut-outs, renders, order,
# copy). `enabled: false` restores the WP3 behaviour for everything in this block.
# --------------------------------------------------------------------------- #
readiness:
  enabled: true
  master:
    # What a root implies for the gender property. Roots not listed imply
    # nothing — the property stands on its own there (decision 4: Unisex keeps
    # the property, Kids is rendered from it).
    gender_by_root: {Men: men, Women: women}
    genderless_roots: [Unisex, Kids]
    # The photo audit now says which gender the GARMENT photographs suggest.
    # `soft` records a contradiction as a flag; `hold` makes it
    # MASTER_CATEGORY_MISMATCH. Soft until the shadow run has measured it —
    # the phase 1 exit criterion. The render never votes either way.
    photo_check: soft
    photo_min_confidence: 0.85
  # Unisex master: the gender property picks the model and the guide.
  unisex_gender_source: property
  mannequin:
    # The rig vocabulary the edit screen offers (vnyx-ui formatters.ts). A
    # derived rig must be one of these or the dropdown renders blank.
    upper: {men: "Men Top", women: "Women Top", any: "Top"}
    bottom: "Bottom"
    kids: "Kids"
  # A house choice (a category, a guide) wins a tie only when the tenant uses it
  # at least this many times more often than the runner-up.
  usage_tiebreak_ratio: 2

  # --- phase 4: the renders (docs/READINESS-PLAN.md §4 step 5) ----------------
  #
  # The gate refuses a render (wrong gender, wrong build, no model, broken
  # body); the chain re-renders what the refusal names — the whole set for a
  # gender or build problem, the one view for a defect — through the render
  # step's `views` option, and judges the result once more. See
  # app/imaging/quality_gate.py (size_band, regen_views).
  #
  # One paid regeneration per product per run. A second refusal holds; credits
  # are spent once, never in a loop.
  max_regenerations_per_run: 1
  # Decision 4: Kids products are rendered with a child model, never held for
  # being Kids. `hold` leaves their renders to a person.
  kids_renders: generate
  # Decision 8: a product nothing can repair — no garment photograph
  # (NO_GARMENT_PHOTO), every image model declining the print (RENDER_REFUSED)
  # — is rejected with its reason through the reject step, which archives any
  # listing. `hold` keeps it in Review for a person instead.
  unfixable: reject
  # Roots that mean a child model, judged against no adult build.
  kids_roots: [Kids, Kid, Children, Child]
  # The model's build against the garment's size. The gate's one call gains a
  # `model_build` field (slim | average | plus | unknown); the size maps to a
  # band through `bands`, a waist through `waist_bands` (bottoms with a
  # gender), and the two are compared.
  body_size:
    enabled: true
    # Below this confidence a two-band gap is a soft flag, not a re-render.
    min_confidence: 0.7
    # Slim on an XL regenerates; average against plus is a soft flag.
    block_on_band_gap: 2
    bands: {xs: slim, s: slim, m: average, l: average, xl: plus, xxl: plus}
    # Decision 9 as shipped in vnyx-api services/body-type.ts: waist inches →
    # letter, per gender, continuous from 20 to 60.
    waist_bands:
      men:   {xs: [20, 29], s: [30, 31], m: [32, 33], l: [34, 37], xl: [38, 41], xxl: [42, 60]}
      women: {xs: [20, 25], s: [26, 27], m: [28, 29], l: [30, 31], xl: [32, 33], xxl: [34, 60]}

  # --- phase 5: the gallery order and the copy (§4 steps 7 and 8) -------------
  gallery:
    enabled: true
    # `soft`: IMG.025 (the cache is out of the catalog order) is a flag;
    # `block`: it holds. The chain's `order` step rebuilds the cache through
    # vnyx-api either way; a gallery a person arranged is never touched.
    hold: soft
    # Decisions 2 and 3 for every tenant, mirrored from vnyx-api ORIGIN_RANK:
    # renders → uploads (manual, web) → photobooth front/back → decision-portal
    # front/back → label → size chart; cut-outs before raws. Inside the garment
    # band the origin leads; the bands and views are the schema's own.
    origin_order: [AI, MANUAL, WEB, PHOTOBOOTH, DECISION, SIZE_GUIDE]
    # Leave a gallery flagged `mediaManualOrder` as it is? The flag's intent is
    # an operator's drag-and-drop — but vnyx-api's updateProduct sets it on
    # EVERY save that carries `images` (the edit screen's Save always does), so
    # on production 1,538 of 4,877 approved products carry it in the machine's
    # own old order (MID-000247). It marks a gallery that was saved, not one a
    # person chose. NOT trusted: IMG.025 judges those galleries too and the
    # order step rebuilds them (vnyx-api reorder step, `--include-manual`).
    # vnyx-api now sets the flag only when the asserted order actually differs
    # from the cache (deploy ①); once the flags have been re-earned, `true`.
    respect_manual: false
  copy:
    enabled: true
    # The `copy` step regenerates the title and description from the CURRENT
    # record when this run changed any of these (the title template's inputs)…
    trigger_fields: [gender, masterCategory, category, subCategory, size, color, brand]
    # …or when the copy already disagrees with the record. TEXT.008 is new:
    # the title's own size or garment word contradicts the record.
    trigger_rules: [TEXT.002, TEXT.003, TEXT.006, TEXT.007, TEXT.008]

  # --- phase 3: the cut-outs (docs/READINESS-PLAN.md §4 step 3) ---------------
  #
  # Each live FRONT/BACK cut-out is measured against the original it was cut
  # from and the backdrop the tenant wants. A wrong one is re-matted through
  # `backfill-bg-removal.ts --replace` (Hermes segmenter, source canvas,
  # tenant backdrop) and measured again. See app/imaging/cutouts.py.
  cutouts:
    enabled: true
    # `soft`: a cut-out still wrong after the re-matte is a flag on the run.
    # `block`: it holds the product as CUTOUT_UNFIXABLE. Soft until the shadow
    # run over approved products has reported the false-hold rate — the
    # phase 3 exit criterion. Flip here, no code change.
    hold: soft
    # The cut-out's ASPECT RATIO may differ from the original's by this
    # fraction. The ratio and not the size: the Gemini segmenter returns a
    # fixed ~1 MP canvas (896×1195 for a 3:4 photograph), a uniform downscale
    # of the whole frame with the garment in the same place — looked at on
    # BOA-006175, -006127, -006166 before this was settled. That is not zoom.
    # A crop to the garment changes the ratio, and is.
    canvas_tolerance: 0.02
    # THE RATIO TEST ABOVE CANNOT SEE A ZOOM, and that is what `garment_check`
    # is for: the cut-out compared with the PHOTOGRAPH it was cut from
    # (app/imaging/cutouts.py garment_hole). Downloads the original; ~0.5s of
    # numpy per view.
    #
    #   framing  AUTO (19 Sep 2026). The cut-out's garment against the
    #            PHOTOGRAPH's garment at the same coordinates. It asks a lit
    #            studio wall where the garment is, and a wall close to the
    #            garment's own colour cannot say: BOA-006151's garment sits 15
    #            from its backdrop, BOA-006153's 23 and MID-000521's 55 against
    #            a tolerance of 40, so correct cut-outs scored 60.9%, 75.7% and
    #            73.2% and were held as CUTOUT_UNFIXABLE; only the pair with a
    #            separation of 204 cleared 90%.
    #
    #            IT WAS TURNED OFF ENTIRELY AND THAT REMOVED THE CHECK. The
    #            replacement, `box_fill_max`, needs the garment's bounding box
    #            to cover 90% of the frame, which on a portrait canvas means 90%
    #            of its WIDTH — a garment never is. MID-000615's FRONT cut-out
    #            is zoomed, scored 0.805, covers 30.8% of its frame, and passed
    #            every remaining test.
    #
    #            So the separation is now MEASURED (`garment_hole.separation`)
    #            and the test judges only above `min_separation`. Below it the
    #            answer is unknown, and `scale_check` is what covers that band.
    #            docs/PICTURE-CHECK-FIXES.md §1.3. `false` restores the retired
    #            behaviour; `true` judges regardless of the wall.
    #   loss     garment-coloured pixels missing at the neckline: the mask ate
    #            the collar. Re-cut.
    #   residue  OFF. It called a brighter patch of the studio wall a display
    #            form, and flagged correct cut-outs of garments hanging open on
    #            a hanger (KLE-000124 at 5.6% and 4.7%, KLE-000045 at 0.9%).
    #            The measurement is still recorded on the row; the test needs a
    #            separator that works before it can be trusted again.
    garment_check:
      enabled: true
      residue_check: false
      alignment_check: auto
      # Above every measured false positive (15, 23, 55), far below the one
      # sound judgement (204).
      min_separation: 90
    # THE ZOOM TEST THAT NEEDS NO PHOTOGRAPH. One garment, one canvas, one
    # booth: two views should cover comparable fractions of their frames, so a
    # cut-out standing `max_area_ratio` times its smallest sibling was cropped
    # to the garment and scaled back up. MID-000615: FRONT 0.3078 against BACK
    # 0.0894 — 3.4x the area, ~1.9x linear. The smallest is the reference
    # because a zoom only ever enlarges. Silent when every cut-out on the
    # product is zoomed by the same amount; that case is `framing` above.
    scale_check:
      enabled: true
      min_views: 2
      max_area_ratio: 2.2
      min_reference_area: 0.02
    # A cut-out whose garment touches this many of its four edges (outermost
    # pixel line, `edge_touch_min_fraction` of it) was cut to its bounding box.
    crop_edges_touched: 4
    edge_touch_min_fraction: 0.01
    # A pixel on that line is garment only this far (RGB) from the backdrop:
    # edge vignetting and compression noise sit 15-25 off it and are not a hem.
    edge_rgb_tolerance: 40
    # THE SAME CROP AFTER `fitToCanvas` PADDED IT BACK OUT to the source ratio,
    # which the edge test above cannot see and the ratio test never could:
    # KLE-000028's FRONT is 896×1195 on a 3000×4000 photograph — the identical
    # 0.750 ratio — with the trousers 1.4× larger and touching no edge. The
    # fraction of its OWN frame the garment's bounding box may cover. 0.90
    # because a booth capture always leaves margin: BOA-006127's shirt reaches
    # the left and right edges (in the original too) but only ~0.6 of the
    # height, so its box covers ~0.6 and it is not touched, while a crop covers
    # 1.00 and a padded crop within a few percent of it. Needs no photograph —
    # which is why it replaced the overlap test. docs/PICTURE-CHECK-FIXES.md §2.
    box_fill_max: 0.90
    # THE GARMENT'S SHAPE IS DERIVED, NOT ASSUMED (§0). Every cut-out vnyx-api
    # stores is fully opaque, composited on rgb(235,235,235) — 0.0% alpha-clear
    # on MID-000521, MID-000591, BOA-006151 and BOA-006153 — so `alpha > 128`
    # selected the whole frame and every geometric measurement built on it was
    # measuring the frame. The alpha is read only when some of the picture is
    # genuinely clear (`mask_alpha_min_clear`; Hermes' own output is 50-80%
    # clear, a composited one 0.0%); otherwise the garment is segmented against
    # the cut-out's OWN backdrop, taken from its four corners — flat and uniform
    # by construction, unlike the raw photograph's lit wall. The corners and not
    # the border ring because the ring is the garment's colour whenever the
    # garment crosses it. A mask covering less than `mask_min_fraction` or more
    # than `mask_max_fraction` of the frame is not a garment: the measurement is
    # `unknown` and nothing is flagged from it.
    mask_alpha_min_clear: 0.02
    mask_alpha_threshold: 128
    mask_corner_fraction: 0.04
    # Tight — 24 against the 40 the raw photograph needs — because this backdrop
    # was painted, not lit.
    mask_rgb_tolerance: 24
    mask_min_fraction: 0.005
    mask_max_fraction: 0.95
    # Decision 1: the tenant's `background` setting wins; this when unset.
    # Mirrors vnyx-api's resolveMatteBackdrop, which is what the re-matte
    # applies — the check and the fix must agree.
    background_default: "#FFFFFF"
    # CIE76 ΔE between the border's median colour and the tenant's hex.
    # #FFFFFF against #EBEBEB is ΔE ≈ 7, so this sits well under it.
    color_tolerance: 4.0
    # Fraction of the opaque border that must be the backdrop colour. Low on
    # purpose: a composited cut-out is exactly the backdrop wherever it is not
    # garment, so sleeves at the frame edge (BOA-006127, 84%) still pass and a
    # stockroom wall (near 0%) does not.
    backdrop_min_fraction: 0.5
    # Per-pixel RGB distance that still counts as "the backdrop colour".
    rgb_tolerance: 12
    # Fraction of the border that must be fully transparent to call a cut-out
    # transparent (the tenant setting `transparent` only); above
    # `partial_transparent_min` on a colour tenant the backdrop was applied to
    # part of the picture only.
    transparent_border_min: 0.85
    partial_transparent_min: 0.15
    border_fraction: 0.06
    fetch_timeout_s: 15
    fetch_deadline_s: 40

# --------------------------------------------------------------------------- #
# Readability — can the text in a phone photograph actually be read?
#
# Fires at shutter press, so the whole answer has to come back inside ~1.5s and
# the operator has to be told what to fix. No model call: OCR detection plus
# recognition confidence, and pixel statistics to explain a failure.
#
# Every number below was measured — see docs/READABILITY.md for the harness and
# the tables. Two findings shaped the design and are worth stating here because
# they are counter-intuitive:
#
#   1. No pixel statistic is a usable GATE. A defocused label with a Laplacian
#      variance of 1.7 read perfectly at 0.99 confidence, while a motion-blurred
#      one at 103.6 was unreadable. Brightness is no better: a frame at mean 28.8
#      (nearly black to the eye) still read at 0.994, because the recognizer
#      normalises contrast per line. Gating on any of these produces false
#      rejections on photographs OCR handles fine.
#
#   2. Confidence alone is not enough either. When text is too small, detection
#      finds a FEW fragments and the recognizer is confident about those — 3 of 6
#      lines at 0.97 confidence with 63% of characters wrong. Mean confidence
#      passes it; a line/character floor is what catches it.
#
# So: confidence and coverage DECIDE, pixel statistics EXPLAIN.
# --------------------------------------------------------------------------- #
readability:
  # Long edge the image is scaled to before OCR. THE latency knob — detection
  # cost scales with pixel count, and on a 4-core i7-8565U the measured medians
  # were 618ms at 512px, 784ms at 640px, 944ms at 800px and 2244ms at 1280px.
  #
  # 800 rather than 640 because 640 is where accuracy starts to go: text at 0.9%
  # of frame height (a label shot at arm's length) came back with 52% of its
  # characters wrong at 640px and perfect at 800px. Below ~0.7% nothing works at
  # any resolution.
  #
  # Lower this to buy latency on a 2-vCPU box, and re-run the harness if you do.
  working_px: 800

  # Recognition score below which a line is treated as noise rather than text.
  # Measured floor: every line of a readable frame scored >= 0.914, and the worst
  # unreadable frame's best line was 0.694.
  line_score_min: 0.80

  # Mean recognition score across the kept lines. Readable frames measured
  # 0.973-0.994; unreadable ones 0.000-0.783, so the gap either side of 0.90 is
  # wide and this is not a knife-edge.
  mean_score_min: 0.90

  # How much text has to be there before "readable" means anything. These are the
  # coverage floors that catch the too-small-text case confidence misses.
  #
  # Deliberately permissive defaults, because how much text SHOULD be in frame is
  # the caller's domain knowledge, not Hermes's — a care label has six lines, a
  # size tag has two. Both are overridable per request, and a client photographing
  # a known label type should raise them.
  min_lines: 1
  min_chars: 3

  # Median detected line height, in working-resolution pixels, above which the
  # text that WAS found counts as properly resolved.
  #
  # Used only to word the NOT_ENOUGH_TEXT message, never to decide. It separates
  # the two opposite things a missed line floor can mean: a distant label whose
  # other lines went undetected ("move closer"), or a label that genuinely
  # carries fewer lines than the caller asked for ("lower your floor"). Telling
  # an operator to move closer when the label already fills the frame makes them
  # retake a perfectly good photograph indefinitely.
  #
  # 20 because detected box height bottoms out at 13px on this detector — its
  # vertical padding floor — so 13 means "as small as it gets" while the readable
  # sizes in the harness measured 13-41px and an adidas neck mark measured 149.
  resolved_text_min_height_px: 20

  # Fraction of DETECTED lines that may fall below line_score_min before the
  # frame is called partially legible. Some illegible clutter beside a clean label
  # is normal — a fold, a seam, a barcode — so this is not zero.
  max_weak_line_fraction: 0.5

  # --- the one pre-OCR gate -------------------------------------------------
  #
  # An empty frame is the single case pixel statistics DO settle, and skipping
  # OCR on it saves the ~900ms the model would spend finding nothing. Measured:
  # a covered lens, a blown-out frame, a grey wall and plain garment fabric all
  # came in at contrast <= 1.4, while the least contrasty READABLE frame measured
  # 2.1. The floor sits below that with margin, so it only ever catches frames
  # with no structure at all.
  blank_frame_max_contrast: 1.5

  # --- explanation thresholds ------------------------------------------------
  #
  # Read ONLY when the verdict is already "not readable", to say why. They never
  # decide, so they are tuned to describe the common cause rather than to avoid
  # false positives.
  explain:
    # Laplacian variance below which "out of focus" is the likely story. Set from
    # the unreadable motion-blur cases (81.8-103.6) rather than from the defocus
    # ones, which go to ~0.1 and would drag it uselessly low.
    soft_focus_max_sharpness: 120.0
    # Mean luma outside this band gets mentioned as a contributing cause.
    #
    # The upper bound is 248 and not lower because A CARE LABEL IS WHITE: the
    # pristine frames in the harness measured 243.4 mean luma and read at 0.99,
    # as did every low-contrast and JPEG variant of them (242.4-243.4). An
    # earlier 235.0 told operators to "move out of direct light" on correctly
    # exposed photographs of white fabric. Genuine glare measured 253.2-253.5,
    # so the gap is real but it sits higher than it looks.
    dark_max_brightness: 45.0
    bright_min_brightness: 248.0
    # Fraction of pixels at 250+ that reads as glare worth mentioning. This is
    # the better glare signal of the two — a reflection blows out a REGION, and
    # the harness separated cleanly on it (0.7% pristine against 96.9% glare)
    # while mean luma barely moved.
    glare_min_clipped_fraction: 0.25
    # Mean luma stddev below which the frame is called washed out.
    flat_max_contrast: 4.0

  # Hard cap on the upload Hermes will decode, in megabytes. A phone that skips
  # its client-side resize sends 3-5MB; anything past this is a mistake or an
  # attack, and decoding it would blow the latency budget regardless.
  max_upload_mb: 12